<svg viewBox="0 0 300 172" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Beam-search tree: from each kept plan branch K modes, keep the top-B, prune the rest, repeat to depth D until a path reaches a success plan.">
  <style>
    .be{ stroke:#1b1d1f; stroke-width:1.4; fill:none; }
    .be.pruned{ stroke-dasharray:3 3; stroke-opacity:.25; }
    .bn{ fill:#fcfcfb; stroke:#1b1d1f; stroke-width:1.4; }
    .bn.pruned{ stroke-opacity:.3; }
    .bn.root{ fill:#1b1d1f; }
    .bn.win{ fill:#39525f; stroke:#39525f; }
    .lbl{ font:600 8px -apple-system,Segoe UI,Roboto,sans-serif; fill:#6b7075; }
    .lg{ font:9px -apple-system,Segoe UI,Roboto,sans-serif; fill:#6b7075; }
    @media (prefers-color-scheme: dark){
      .be{ stroke:#e9eaec; }
      .bn{ fill:#141618; stroke:#e9eaec; }
      .bn.root{ fill:#e9eaec; }
      .bn.win{ fill:#8fb1c4; stroke:#8fb1c4; }
      .lbl,.lg{ fill:#9aa0a6; }
    }
  </style>

  <!-- step labels -->
  <text class="lbl" x="24"  y="12" text-anchor="middle">root</text>
  <text class="lbl" x="112" y="12" text-anchor="middle">branch K</text>
  <text class="lbl" x="200" y="12" text-anchor="middle">keep top-B</text>
  <text class="lbl" x="284" y="12" text-anchor="middle">success</text>

  <g transform="translate(0,8)">
    <!-- edges -->
    <line class="be"        x1="24"  y1="75"  x2="112" y2="40"/>
    <line class="be"        x1="24"  y1="75"  x2="112" y2="75"/>
    <line class="be pruned" x1="24"  y1="75"  x2="112" y2="110"/>
    <line class="be"        x1="112" y1="40"  x2="200" y2="28"/>
    <line class="be pruned" x1="112" y1="40"  x2="200" y2="55"/>
    <line class="be"        x1="112" y1="75"  x2="200" y2="95"/>
    <line class="be pruned" x1="112" y1="75"  x2="200" y2="122"/>
    <line class="be"        x1="200" y1="28"  x2="284" y2="24"/>
    <line class="be"        x1="200" y1="95"  x2="284" y2="100"/>
    <!-- nodes -->
    <circle class="bn root"       cx="24"  cy="75"  r="6"/>
    <circle class="bn"            cx="112" cy="40"  r="6"/>
    <circle class="bn"            cx="112" cy="75"  r="6"/>
    <circle class="bn pruned"     cx="112" cy="110" r="6"/>
    <circle class="bn"            cx="200" cy="28"  r="6"/>
    <circle class="bn pruned"     cx="200" cy="55"  r="6"/>
    <circle class="bn"            cx="200" cy="95"  r="6"/>
    <circle class="bn pruned"     cx="200" cy="122" r="6"/>
    <circle class="bn win"        cx="284" cy="24"  r="6.5"/>
    <circle class="bn"            cx="284" cy="100" r="6"/>
  </g>

  <!-- legend -->
  <g transform="translate(0,164)">
    <circle class="bn"        cx="12"  cy="-3" r="5"/>
    <text class="lg" x="22"  y="0">beam (top-B)</text>
    <circle class="bn pruned" cx="110" cy="-3" r="5"/>
    <text class="lg" x="120" y="0">pruned</text>
    <circle class="bn win"    cx="176" cy="-3" r="5"/>
    <text class="lg" x="186" y="0">success plan</text>
  </g>
</svg>
