[project]
name = "robopro"
version = "0.1.0"
description = "RoboPRO environment bootstrap"
requires-python = ">=3.10,<3.13"
dependencies = [
    "azure==4.0.0",
    "azure-ai-inference",
    "av",
    "ffmpeg",
    "gymnasium==0.29.1",
    "h5py",
    "huggingface_hub==0.25.0",
    "imageio==2.34.2",
    "matplotlib",
    "moviepy",
    "mplib==0.2.1; platform_machine == 'x86_64'",
    "numpy<2",
    "open3d==0.18.0; platform_machine == 'x86_64'",
    "openai",
    "pydantic",
    "pyglet<2",
    "sapien==3.0.0b1; platform_machine == 'x86_64'",
    "scipy==1.10.1; python_version < '3.11'",
    "scipy>=1.13,<2; python_version >= '3.11'",
    "setuptools==69.5.1",
    "termcolor",
    "torch==2.4.1; platform_machine == 'x86_64'",
    "torchvision; platform_machine == 'x86_64'",
    "transforms3d==0.4.2",
    "trimesh==4.4.3",
    "warp-lang==1.12.0",
    "wandb",
    "zarr",
    "pytorch3d; platform_machine == 'x86_64'",
]

[tool.uv]
package = false

[tool.uv.sources]
pytorch3d = { git = "https://github.com/facebookresearch/pytorch3d.git", rev = "75ebeeaea0908c5527e7b1e305fbc7681382db47" }

[tool.uv.extra-build-dependencies]
pytorch3d = ["torch==2.4.1"]
