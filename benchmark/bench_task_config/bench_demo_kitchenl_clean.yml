# if you want to modify the config, please check the following tutorial first:
# https://robotwin-platform.github.io/doc/usage/configurations.html
render_freq: 0
episode_num: 100
use_seed: false
save_freq: 15
embodiment: [aloha-agilex]
language_num: 100
domain_randomization:
  random_background: false
  cluttered_table: False
  clean_background_rate: 0
  random_head_camera_dis: 0
  random_table_height: 0
  random_light: false
  crazy_random_light_rate: 0
  obstacle_density: 0

  # Not a perturbation: single fixed canonical prompt. This hook is the only
  # path that bypasses the per-episode instruction templating (which rejects
  # the placeholder-less plain instruction for tasks with object params like
  # put_bottle_in_fridge). A 1-entry bank => no language variation.
  # Absolute path: the client CWD (customized_robotwin) can't resolve a
  # benchmark/-relative path.
  language_perturbation:
    enabled: true
    instruction_bank: /home/apexs/xuan/project/RoboPRO/benchmark/bench_task_config/instruction_bank_fixed.json
camera:
  head_camera_type: D435
  wrist_camera_type: D435
  demo_camera_type: D435
  collect_head_camera: true
  collect_wrist_camera: true
data_type:
  rgb: true
  third_view: false
  depth: true
  pointcloud: false
  observer: false
  endpose: true
  qpos: true
  mesh_segmentation: false
  actor_segmentation: false
  proximity: true
pcd_down_sample_num: 1024
pcd_crop: true
save_path: ./data/bench_data
clear_cache_freq: 1
collect_data: true
eval_video_log: true
# Data collection: no collision metrics. Set true for evaluation.
enable_collision_metrics: true
