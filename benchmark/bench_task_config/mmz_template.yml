# ============================================================================
# mmz_template.yml — EXAMPLE grounding data-gen config (copy me, don't run me)
#
# Purpose: one working reference for collecting grounding data (per-object
# masks + depth + role sidecar). Copy → rename → tune episode_num /
# obstacle_density. Full context: DATA_GEN_HANDOFF.md at repo root.
#
# Run (from customized_robotwin/, env `robopro`, ROBOTWIN_BENCH_TASK=bench):
#   bash collect_data.sh <task_name> <this_config_name> <gpu_id>
# ============================================================================

render_freq: 0
episode_num: 10            # episodes to KEEP (seed search runs until it banks this many)
use_seed: false            # true = replay seeds from <save_dir>/seed.txt instead of searching
                           #        (matched pairs: copy seed.txt from a finished twin run first)
save_freq: 15
embodiment: [aloha-agilex]
language_num: 100
domain_randomization:
  random_background: false
  cluttered_table: True    # False + obstacle_density 0 = clean scenes
  clean_background_rate: 0
  random_head_camera_dis: 0
  random_table_height: 0
  random_light: false
  crazy_random_light_rate: 0
  obstacle_density: 10     # 6..15 in the benchmark's cluttered range (0 = clean)

  language_perturbation:
    enabled: true          # base-language diversity ONLY (instruction_bank.json).
    instruction_bank: benchmark/bench_task_config/instruction_bank.json
                           # The colloquial/vision/object-OOD banks are EVAL-ONLY —
                           # don't bake them into training data.
camera:
  head_camera_type: D435   # keep D435 everywhere = matched to eval cameras
  wrist_camera_type: D435
  demo_camera_type: D435
  collect_head_camera: true
  collect_wrist_camera: true
data_type:
  rgb: true
  third_view: false
  depth: true              # needed for the 3D lift (dense clouds rebuilt from depth + K/E)
  pointcloud: false        # stock cloud = head-cam-only 1024 pts — we rebuild instead
  observer: false
  endpose: true
  qpos: true
  mesh_segmentation: false # sub-part ids, no name map — not needed
  actor_segmentation: true # [MMZ] per-object masks, saved as RAW uint16 ids (PNG in HDF5)
  actor_bbox: true        # [MMZ] exact per-frame 3D boxes from the physics engine
                           #   (pose + world AABB per rigid object, incl. occluded
                           #   extents). Tiny (~KBs/ep) but CANNOT be derived after
                           #   collection — recommended ON. Read back via
                           #   `export.py --what bbox3d_exact`; camera-only (visible-
                           #   surface) boxes are always derivable without it.
pcd_down_sample_num: 1024
pcd_crop: true
save_path: ./data/dataset
clear_cache_freq: 1
collect_data: true
eval_video_log: true

# Stock collision-metrics switch. NOTE the stock coupling: when true, the CuRobo
# planner is also made BLIND to clutter obstacles (eval behavior). The labeling /
# collision-interpretation layer that will sit on top of this is being redesigned —
# see DATA_GEN_HANDOFF.md §3.
enable_collision_metrics: false
